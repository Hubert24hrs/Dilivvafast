name: Flutter CI/CD

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

env:
  # pubspec.yaml requires Dart SDK ^3.8.1. The workflow previously pinned
  # Flutter 3.24.0, which ships Dart 3.5 — `flutter pub get` could not have
  # resolved, so CI was failing before it reached a single test.
  FLUTTER_VERSION: '3.47.1'

jobs:
  # ---------------------------------------------------------------------------
  # Guard: nothing secret-shaped reaches the repository.
  # ---------------------------------------------------------------------------
  secrets-scan:
    name: Secret scan
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Block committed .env files
        run: |
          if git ls-files --error-unmatch .env 2>/dev/null; then
            echo "::error::.env is tracked. It must never be committed."
            exit 1
          fi
          echo "OK: .env is not tracked."

      - name: Scan working tree for credential patterns
        run: |
          # Paystack/Stripe secret keys, private keys, Anthropic keys.
          # .env.example is excluded: it holds placeholders by design.
          if grep -rInE \
            "(sk_live_|sk_test_[0-9a-f]{20,}|sk-ant-[A-Za-z0-9_-]{20,}|-----BEGIN [A-Z ]*PRIVATE KEY-----)" \
            --exclude-dir=.git \
            --exclude-dir=build \
            --exclude-dir=node_modules \
            --exclude=.env.example \
            --exclude=SECURITY.md \
            . ; then
            echo "::error::Credential-shaped string found. Remove it and rotate the key."
            exit 1
          fi
          echo "OK: no credential patterns found."

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        continue-on-error: true

  # ---------------------------------------------------------------------------
  # Flutter analysis and tests.
  # ---------------------------------------------------------------------------
  test:
    name: Test & Analyze
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Verify formatting
        run: dart format --output=none --set-exit-if-changed lib test

      - name: Analyze code
        # Fails on any analyzer diagnostic, including infos.
        run: flutter analyze

      - name: Run tests
        run: flutter test --coverage

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@v4
        with:
          files: ./coverage/lcov.info
          flags: unittests
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  # Cloud Functions: these move money, so they are type-checked and linted.
  # ---------------------------------------------------------------------------
  functions:
    name: Cloud Functions
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: functions
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: functions/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Type-check
        run: npx tsc --noEmit

      - name: Build
        run: npm run build

      # The emulator needs a JVM for Firestore.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Provide emulator secrets
        # Dummy values. These functions never reach Paystack or Anthropic in
        # the tests below; defineSecret only requires that a value exists.
        run: |
          printf 'PAYSTACK_SECRET_KEY=sk_test_ci_dummy\nANTHROPIC_API_KEY=sk-ant-ci-dummy\n' > .secret.local

      - name: Integration tests (pricing, promo redemption)
        env:
          # Discovery defaults to 10s, which is not always enough on a cold
          # runner; the failure mode is an unhelpful "cannot determine backend
          # specification".
          FUNCTIONS_DISCOVERY_TIMEOUT: 120
        run: npm run test:integration

  # ---------------------------------------------------------------------------
  # Firestore security rules, exercised against the emulator.
  # These assertions were written during the 2026-09 audit but never executed
  # locally (no JVM on that machine) — CI is where they actually run.
  # ---------------------------------------------------------------------------
  firestore-rules:
    name: Firestore rules
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      - name: Install test dependencies
        working-directory: test/firestore-rules
        run: npm install

      - name: Run rules tests
        working-directory: test/firestore-rules
        run: npm test

  # ---------------------------------------------------------------------------
  # Builds. Gated on everything above passing.
  # ---------------------------------------------------------------------------
  build-android:
    name: Build Android APK
    runs-on: ubuntu-latest
    needs: [test, functions, secrets-scan]
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create .env for build
        # Only public, publishable values. Secrets live in Secret Manager and
        # are read by Cloud Functions, never bundled into the app.
        run: |
          cat > .env <<EOF
          MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}
          PAYSTACK_PUBLIC_KEY=${{ secrets.PAYSTACK_PUBLIC_KEY }}
          APP_ENV=production
          API_BASE_URL=https://api.dilivvafast.ng
          EOF

      - name: Build APK
        run: flutter build apk --release --flavor production

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dilivvafast-apk
          path: build/app/outputs/flutter-apk/app-production-release.apk
          retention-days: 30

  build-appbundle:
    name: Build Android App Bundle
    runs-on: ubuntu-latest
    needs: [test, functions, secrets-scan]
    if: github.ref == 'refs/heads/main'
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: 'stable'
          cache: true

      - name: Get dependencies
        run: flutter pub get

      - name: Create .env for build
        run: |
          cat > .env <<EOF
          MAPBOX_ACCESS_TOKEN=${{ secrets.MAPBOX_ACCESS_TOKEN }}
          PAYSTACK_PUBLIC_KEY=${{ secrets.PAYSTACK_PUBLIC_KEY }}
          APP_ENV=production
          API_BASE_URL=https://api.dilivvafast.ng
          EOF

      - name: Build App Bundle
        # -PrequireReleaseSigning=true makes the build fail rather than fall
        # back to the debug key. A debug-signed bundle is not publishable, and
        # discovering that at upload time is too late.
        run: flutter build appbundle --release --flavor production -PrequireReleaseSigning=true

      - name: Upload App Bundle artifact
        uses: actions/upload-artifact@v4
        with:
          name: dilivvafast-aab
          path: build/app/outputs/bundle/productionRelease/app-production-release.aab
          retention-days: 30
