name: dilivvafast
description: "Dilivvafast — Nigerian on-demand logistics & delivery platform."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.8.1

dependencies:
  flutter:
    sdk: flutter

  cupertino_icons: ^1.0.8

  # State management
  flutter_riverpod: ^3.0.3
  riverpod_annotation: ^3.0.3

  # Navigation
  go_router: ^17.0.0

  # Firebase
  firebase_core: ^4.2.1
  firebase_auth: ^6.1.2
  cloud_firestore: ^6.1.0
  cloud_functions: ^6.0.7
  firebase_messaging: ^16.0.4
  firebase_storage: ^13.0.4
  firebase_analytics: ^12.0.4
  firebase_performance: ^0.11.1+3
  firebase_crashlytics: ^5.0.8

  # Maps
  mapbox_maps_flutter: ^2.12.0

  # UI
  fl_chart: ^0.69.0
  flutter_animate: ^4.5.2
  google_fonts: ^6.3.2
  font_awesome_flutter: ^10.9.1
  shimmer: ^3.0.0
  cached_network_image: ^3.4.1
  flutter_markdown: ^0.7.5

  # Location
  geolocator: ^14.0.2
  geocoding: ^4.0.0

  # Media
  image_picker: ^1.2.1

  # Notifications
  flutter_local_notifications: ^19.5.0

  # Utilities
  intl: ^0.20.2
  url_launcher: ^6.3.2
  share_plus: ^12.0.1
  path_provider: ^2.1.5
  connectivity_plus: ^6.1.2
  package_info_plus: ^8.0.0

  # Auth
  google_sign_in: ^6.2.1
  sign_in_with_apple: ^6.1.1
  local_auth: ^2.3.0

  # Storage
  flutter_secure_storage: ^9.2.2
  hive: ^2.2.3
  hive_flutter: ^1.1.0

  # Networking & data
  http: ^1.2.0
  dio: ^5.7.0

  # Environment & secrets
  flutter_dotenv: ^6.0.0

  # Payment
  flutter_paystack_plus: ^2.0.0

  # Crypto & security
  crypto: ^3.0.3
  encrypt: ^5.0.3

  # Documents
  pdf: ^3.11.3
  mailer: ^6.0.1

  # Functional programming
  fpdart: ^1.1.0
  rxdart: ^0.28.0

  # Code generation annotations
  freezed_annotation: ^3.1.0
  json_annotation: ^4.9.0

  # Background service
  flutter_background_service: ^5.0.12

dev_dependencies:
  flutter_test:
    sdk: flutter
  mockito: ^5.4.4
  build_runner: ^2.4.13
  riverpod_generator: ^3.0.3
  freezed: ^3.2.3
  json_serializable: ^6.8.0
  riverpod_lint: ^3.0.3
  flutter_lints: ^5.0.0
  flutter_launcher_icons: ^0.14.2

flutter:
  uses-material-design: true

  assets:
    - .env
    - assets/images/

  # fonts:
  #   - family: Schyler
  #     fonts:
  #       - asset: fonts/Schyler-Regular.ttf
