# Gradle daemon sizing.
#
# This was -Xmx8G with MaxMetaspaceSize=4G, which reserves up to 12G for the
# daemon alone. On a 16G machine — with the Kotlin daemon, the Dart frontend
# and the OS also resident — that over-commits memory and the daemon gets
# killed mid-build. The symptom is unhelpful:
#
#   Gradle build daemon disappeared unexpectedly (it may have been killed or
#   may have crashed)
#
# 4G heap is comfortable for this project and leaves room for everything else.
org.gradle.jvmargs=-Xmx4G -XX:MaxMetaspaceSize=1G -XX:ReservedCodeCacheSize=256m -XX:+HeapDumpOnOutOfMemoryError

android.useAndroidX=true
android.enableJetifier=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false
